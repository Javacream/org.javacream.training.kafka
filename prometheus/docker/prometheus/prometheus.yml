global:
  scrape_interval:     15s 

scrape_configs:

  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9090']

  # kafka brokers
  - job_name: 'broker1'
    scrape_interval: 5s
    static_configs:
    - targets: ['javacream.eu:9200']

  - job_name: 'broker2'
    scrape_interval: 5s
    static_configs:
    - targets: ['javacream.eu:9201']

  - job_name: 'broker3'
    scrape_interval: 5s
    static_configs:
    - targets: ['javacream.eu:9202']

  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

